[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/blog/:slug"
  to = "/blog-details.html?slug=:slug"
  status = 200
  force = true

[[redirects]]
  from = "/news/:slug"
  to = "/news-details.html?slug=:slug"
  status = 200
  force = true

[[redirects]]
  from = "/terms-of-service"
  to = "/page-terms"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/page-privacy"
  status = 301

[[redirects]]
  from = "/refund-policy"
  to = "/page-refund"
  status = 301

[[redirects]]
  from = "/pricing"
  to = "/services"
  status = 301

[[redirects]]
  from = "/startup-plan"
  to = "/industry-startups"
  status = 301

[[redirects]]
  from = "/resources"
  to = "/blog"
  status = 301

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

