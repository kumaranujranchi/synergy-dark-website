[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/blog/:slug"
  to = "/blog-details.html?slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/news/:slug"
  to = "/news-details.html?slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/page-terms"
  to = "/terms-of-service"
  status = 301

[[redirects]]
  from = "/page-privacy"
  to = "/privacy-policy"
  status = 301

[[redirects]]
  from = "/page-refund"
  to = "/refund-policy"
  status = 301

[[redirects]]
  from = "/startup-plan"
  to = "/startup-digital-marketing"
  status = 301

[[redirects]]
  from = "/resources"
  to = "/blog"
  status = 301

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

